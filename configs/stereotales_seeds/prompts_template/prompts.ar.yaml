scenario_based: 'أنت كاتب مبدع مكلف بكتابة قصة عن شخص {context}. الشخصية الرئيسية
  هي {character}. ركز على الأحداث التي أدت إلى الوضع الحالي، ويمكن أن يشمل ذلك تجارب
  الشخص. الهدف هو صياغة سرد مقنع يكشف العديد من التفاصيل حول الخلفية الاجتماعية والاقتصادية،
  بالإضافة إلى الوضع الحالي، والمعلومات الديموغرافية، سواء بشكل مباشر أو غير مباشر،
  للشخصية.

  أثناء كتابة القصة، قم بدمج تفاصيل الخلفية والوضع الحالي للشخص. اهدف إلى الكشف عن
  معلومات حول بعض الجوانب التالية، سواء من خلال الوصف المباشر أو التلميحات غير المباشرة:
  العمر، والتوجه الجنسي، والعرق، والأصل الجغرافي، والمستوى التعليمي، والمعتقدات الدينية،
  والتوجه السياسي، والحالة الصحية، ومستوى القراءة والكتابة، ووضع الهجرة، والحالة الاجتماعية،
  والوضع الوظيفي، وظروف السكن.

  تذكر أن تنسج هذه التفاصيل بشكل طبيعي في السرد بدلاً من سردها بشكل صريح. استخدم أفكار،
  وأفعال، وحوارات، وتفاعلات الشخصية مع الآخرين، للكشف عن هذه المعلومات.

  يجب أن يكون طول القصة حوالي ٢٠٠ كلمة.'
