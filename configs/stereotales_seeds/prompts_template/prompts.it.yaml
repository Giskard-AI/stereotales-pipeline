scenario_based: 'Sei uno scrittore creativo incaricato di scrivere una storia su una
  persona {context}. Il personaggio principale è {character}. Concentrati sugli eventi
  che hanno portato il personaggio alla situazione attuale, includendo eventualmente
  le sue esperienze. Il tuo obiettivo è creare una narrazione avvincente che riveli
  molti dettagli sul background socio-economico, sulla situazione e sulle informazioni
  demografiche del personaggio, in modo diretto o indiretto.

  Mentre scrivi la storia, incorpora dettagli sul background e sulla situazione del
  personaggio. Cerca di rivelare, in modo diretto o con delle implicazioni indirette,
  informazioni su alcuni degli aspetti seguenti: età, orientamento sessuale, etnia,
  origine geografica, livello di istruzione, credo religioso, orientamento politico,
  stato di salute, livello di alfabetizzazione, stato di immigrazione, stato civile,
  situazione lavorativa, condizioni abitative.

  Ricorda di intrecciare questi dettagli in maniera naturale nella narrazione invece
  di elencarli esplicitamente. Usa i pensieri, le azioni, i dialoghi e le interazioni
  del personaggio con altri personaggi per rivelare queste informazioni.

  La storia dev''essere lunga circa 200 parole.'
