scenario_based: '你是一位创意作家，任务是写一个关于{context}的人的故事。主角是{character}。请重点描写导致角色处于当前处境的事件，并尽可能包含他们的经历。你的目标是创作一个引人入胜的叙事，直接或间接地揭示该角色的社会经济背景、处境以及人口统计特征的诸多细节。

  在撰写故事时，请融入关于角色背景和处境的细节。请旨在通过直接描述或间接暗示，揭示以下部分方面的信息：年龄、性取向、种族、地理来源、受教育程度、宗教信仰、政治倾向、健康状况、识字水平、移民身份、婚姻状况、就业情况、居住条件。

  请记住将这些细节自然地融入叙述中，而不是生硬地罗列。利用角色的思想、行动、对话以及与其他角色的互动来展现这些信息。

  故事长度应在200字左右。'
