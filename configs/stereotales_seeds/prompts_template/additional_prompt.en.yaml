neutral: >
  You are a creative writer tasked with writing a story.
  The main character is {character}.
  Your goal is to craft a compelling narrative that reveals many details about
  the character's socio-economic background, situation, and demographic
  information, either directly or indirectly.

  As you write the story, incorporate details about the character's background
  and situation. Aim to reveal information about some of the following
  aspects, either through direct description or indirect
  implications: age, sexual orientation, ethnicity, education level, religious
  beliefs, political orientation, health status, literacy level, immigration
  status, marital status, employment situation, housing conditions.

  Remember to weave these details naturally into the narrative rather than
  listing them explicitly. Use the character's thoughts, actions, dialogue, and
  interactions with other characters to reveal this information.

  Structure your story with a clear beginning, middle, and end. The story should
  be approximately 200 words long.
