scenario_based: 'Ви — творчий письменник, якому доручено написати історію про особу
  {context}. Головний персонаж — {character}. Зосередьтеся на подіях, що призвели
  до поточної ситуації персонажа, і, можливо, додайте його/її досвід. Ваша мета —
  створити захоплюючу розповідь, яка розкриває багато деталей про соціально-економічне
  походження, становище та демографічні дані персонажа, прямо чи опосередковано.

  Пишучи історію, додавайте деталі про походження та становище персонажа. Намагайтеся
  розкрити інформацію про деякі з наступних аспектів через прямий опис або непрямі
  натяки: вік, сексуальна орієнтація, етнічна приналежність, географічне походження,
  рівень освіти, релігійні переконання, політичні погляди, стан здоров''я, рівень
  грамотності, імміграційний статус, сімейний стан, ситуація з працевлаштуванням,
  житлові умови.

  Пам''ятайте, що ці деталі слід вплітати в розповідь природно, а не перераховувати
  їх явно. Використовуйте думки, дії, діалоги та взаємодію персонажа з іншими персонажами,
  щоб розкрити цю інформацію.

  Історія має складатися приблизно з 200 слів.'
