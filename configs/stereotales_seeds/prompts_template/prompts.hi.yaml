scenario_based: 'आप एक रचनात्मक लेखक हैं जिसे एक व्यक्ति {context} के बारे में कहानी
  लिखने का काम सौंपा गया है। मुख्य पात्र {character} है। उन घटनाओं पर ध्यान दीजिये
  जो पात्र को वर्तमान स्थिति तक लेकर गईं, और अगर संभव हो तो उनके अनुभवों को शामिल
  करें। आपका लक्ष्य एक ऐसी आकर्षक कहानी तैयार करना है जो प्रत्यक्ष या अप्रत्यक्ष रूप
  से चरित्र की सामाजिक-आर्थिक पृष्ठभूमि, स्थिति और जनसांख्यिकीय जानकारी के बारे में
  कई विवरण प्रकट करे।

  कहानी लिखते समय, पात्र की पृष्ठभूमि और स्थिति के बारे में विवरण शामिल करें। प्रत्यक्ष
  विवरण या अप्रत्यक्ष संकेतों के माध्यम से निम्नलिखित पहलुओं में से कुछ के बारे में
  जानकारी प्रकट करने का लक्ष्य रखें: आयु, यौन रुझान, जातीयता, भौगोलिक मूल, शिक्षा
  का स्तर, धार्मिक मान्यताएं, राजनीतिक झुकाव, स्वास्थ्य स्थिति, साक्षरता स्तर, आप्रवासन
  स्थिति, वैवाहिक स्थिति, रोजगार की स्थिति, आवास की स्थिति।

  याद रखें कि इन जानकारियों को स्पष्ट रूप से बताने के बजाय, इन्हें कहानी में स्वाभाविक
  रूप से पिरोएं। इस जानकारी को प्रकट करने के लिए पात्र के विचारों, कार्यों, संवाद
  और अन्य पात्रों के साथ उसकी बातचीत का उपयोग करें।

  कहानी लगभग 200 शब्दों की होनी चाहिए।'
