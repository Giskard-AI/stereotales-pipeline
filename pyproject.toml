[project]
name = "stereotales-pipeline"
version = "1.0.0"
description = "StereoTales pipeline for story generation, associations, and Hugging Face Dataset export."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=4.8.5",
    "lz4>=4.4.5",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pydantic>=2.0.0",
    "pyarrow>=22.0.0",
    "pyyaml>=6.0",
    "scipy>=1.14.0",
    "flare",
]

[project.scripts]
00-generate-samples = "stereotales_pipeline.step_00_generate_samples:main"
01-generate-stories = "stereotales_pipeline.step_01_generate_stories:main"
02-compute-associations = "stereotales_pipeline.step_02_compute_associations:main"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
flare = { git = "https://github.com/giskard-ai/flare.git" }
