[project]
name = "fresnel-pipeline"
version = "1.0.0"
description = "Fresnel pipeline for story generation, associations, and StereoTales export."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=4.8.5",
    "lz4>=4.4.5",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pydantic>=2.0.0",
    "pyarrow>=22.0.0",
    "pyyaml>=6.0",
    "scipy>=1.14.0",
    "flare",
]

[project.scripts]
01-generate-stories = "fresnel_pipeline.step_01_generate_stories:main"
02a-compute-associations = "fresnel_pipeline.step_02a_compute_associations:main"
02b-export-fresnel-run-to-stereotales = "fresnel_pipeline.step_02b_export_fresnel_run_to_stereotales:main"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
flare = { git = "https://github.com/giskard-ai/flare.git" }
